name: Build M8 kernel (Lineage 18.1) + MHL force-1080p60 fix

# 触发：推送到任意分支自动跑；也可在 Actions 页手动 Run workflow
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04   # GitHub 免费 Linux x86_64 编译机（你的 Windows/手机都不用装 Linux）
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl xz-utils build-essential bc flex bison libssl-dev

      - name: Clone LineageOS msm8974 kernel (lineage-18.1)
        run: |
          git clone --depth 1 -b lineage-18.1 \
            https://github.com/LineageOS/android_kernel_htc_msm8974.git kernel

      - name: Clone LineageOS arm-linux-androideabi-4.9 toolchain
        run: |
          git clone --depth 1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git toolchain

      - name: Write MHL force-1080p60 patch (embedded) and apply
        run: |
          echo '' | base64 -d > mhl_force_1080p.patch
          cd kernel
          git apply ../mhl_force_1080p.patch || patch -p1 -l --fuzz=3 < ../mhl_force_1080p.patch
          cd ..

      - name: Build kernel (m8_defconfig, ARCH=arm)
        run: |
          set +o pipefail
          export ARCH=arm
          export CROSS_COMPILE=$PWD/toolchain/bin/arm-linux-androideabi-
          cd kernel
          make m8_defconfig
          make -j"$(nproc)" zImage-dtb 2>&1 | tee /tmp/build.log
          if [ ! -f arch/arm/boot/zImage-dtb ]; then
            echo "BUILD FAILED: zImage-dtb not produced"
            tail -n 60 /tmp/build.log
            exit 1
          fi
          cd ..

      - name: Show build output
        run: |
          ls -la kernel/arch/arm/boot/ | grep -E 'Image|zImage' || true
          echo "---- kernel release ----"
          cat kernel/include/config/kernel.release 2>/dev/null || true

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: m8-kernel-zImage-dtb
          if-no-files-found: warn
          path: |
            kernel/arch/arm/boot/zImage-dtb
            kernel/arch/arm/boot/zImage
            kernel/arch/arm/boot/dts/*.dtb
